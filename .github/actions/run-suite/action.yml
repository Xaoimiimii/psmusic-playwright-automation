# Installs the automation project, runs one test suite and keeps the evidence.
# Used by every workflow here and by the application repository's pre-merge workflow,
# so a run looks the same whatever started it. Details: docs/ci-cd.md.
#
# The caller sets PSMUSIC_UI_URL, PSMUSIC_API_URL and PSMUSIC_SERVICE_KEY in the job env.
name: Run PSMusic test suite
description: npm ci, Chromium, Playwright run, run summary, optional Xray Test Execution, Allure report and artifacts

inputs:
  title:
    description: Suite name shown in the run summary, for example "Smoke tests"
    required: true
  grep:
    description: Tag filter passed to --grep, for example "@smoke". Empty runs every test
    required: false
    default: ''
  artifact-suffix:
    description: Artifact names become allure-<suffix> and playwright-<suffix>
    required: true
  typecheck:
    description: '"true" to type-check the project (npm run typecheck) before running the tests'
    required: false
    default: 'false'
  working-directory:
    description: Folder holding this automation project (relative to the workspace)
    required: false
    default: .
  retention-days:
    description: Days the report artifacts are kept. Also written on the Xray Test Execution as their expiry
    required: false
    default: '14'
  xray-import:
    description: '"true" to record the run as an Xray Test Execution linked to this run and its reports (docs/ci-cd.md section 9). Needs XRAY_*, JIRA_* and ATLASSIAN_SITE_URL in the job env'
    required: false
    default: 'false'
  xray-test-plan:
    description: Local ID of an existing Test Plan in test-management/state/issue-map.json (e.g. PLAN-REGRESSION) that the execution joins. Empty for none
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Type-check
      if: inputs.typecheck == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run typecheck

    - name: Install Chromium
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chromium

    # CI=true is set by GitHub: headless, 1 worker, 1 retry, no traces (playwright.config.ts).
    # A failing test fails this step, and therefore the job.
    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GREP: ${{ inputs.grep }}
      run: |
        if [ -n "$GREP" ]; then npx playwright test --grep "$GREP"; else npx playwright test; fi

    # The steps below run even when the tests failed, so the evidence is kept.
    - name: Write results to the run summary
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TITLE: ${{ inputs.title }}
      run: node scripts/ci/write-ci-summary.mjs "$TITLE"

    # Before the Allure report, so the report names the Test Execution. Runs even when no test ran (install,
    # browser or set-up failed): the execution is then created as [NOT RUN] so the CI run stays on record.
    # Never fails the job; problems show as annotations and in the run summary.
    - name: Record the run in Xray
      if: ${{ !cancelled() && inputs.xray-import == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SUITE_TITLE: ${{ inputs.title }}
        SUITE_ID: ${{ inputs.artifact-suffix }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        XRAY_TEST_PLAN: ${{ inputs.xray-test-plan }}
      run: node scripts/ci/xray-execution.mjs import

    - name: Generate Allure report
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run allure:generate

    - name: Upload Allure report and results
      id: allure-artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-${{ inputs.artifact-suffix }}
        path: |
          ${{ inputs.working-directory }}/reports/allure-report/
          ${{ inputs.working-directory }}/reports/allure-results/
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn

    - name: Upload Playwright report, failure screenshots and JUnit
      id: playwright-artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-${{ inputs.artifact-suffix }}
        path: |
          ${{ inputs.working-directory }}/reports/playwright-report/
          ${{ inputs.working-directory }}/reports/test-results/
          ${{ inputs.working-directory }}/reports/xray-report.xml
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore

    # artifact-url is the artifact's own page (…/actions/runs/<id>/artifacts/<artifact-id>): exact, not "latest".
    # Empty when nothing was uploaded; the link then says the report is not available.
    - name: Link the run and its reports from Xray
      if: ${{ !cancelled() && inputs.xray-import == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SUITE_TITLE: ${{ inputs.title }}
        SUITE_ID: ${{ inputs.artifact-suffix }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        ALLURE_ARTIFACT_URL: ${{ steps.allure-artifact.outputs.artifact-url }}
        PLAYWRIGHT_ARTIFACT_URL: ${{ steps.playwright-artifact.outputs.artifact-url }}
      run: node scripts/ci/xray-execution.mjs link
