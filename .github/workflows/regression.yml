# Full regression: every test in tests/, against the deployed environment.
# Runs every night, and by hand from the Actions tab before a release or demo.
# Details: docs/ci-cd.md
name: Regression

on:
  schedule:
    # 01:00 UTC = 08:00 in Vietnam. GitHub may start a scheduled run some minutes late.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PSMUSIC_UI_URL: ${{ vars.PSMUSIC_UI_URL }}
      PSMUSIC_API_URL: ${{ vars.PSMUSIC_API_URL }}
      PSMUSIC_SERVICE_KEY: ${{ secrets.PSMUSIC_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Install, type-check, run every test, keep the evidence.
      # Fails with "Missing environment variable ..." if the configuration is not set.
      - uses: ./.github/actions/run-suite
        with:
          title: Regression tests
          typecheck: 'true'
          artifact-suffix: regression
