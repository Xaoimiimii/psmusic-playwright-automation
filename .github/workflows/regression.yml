# Full regression: every test in tests/, against the deployed environment.
# Runs every night, and by hand from the Actions tab before a release or demo.
# Details: docs/ci-cd.md
name: Regression

on:
  schedule:
    # 01:00 UTC = 08:00 in Vietnam. GitHub may start a scheduled run some minutes late.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PSMUSIC_UI_URL: ${{ vars.PSMUSIC_UI_URL }}
      PSMUSIC_API_URL: ${{ vars.PSMUSIC_API_URL }}
      PSMUSIC_SERVICE_KEY: ${{ secrets.PSMUSIC_SERVICE_KEY }}
      # Optional, not a secret: links Allure results to their Jira issues (docs/reporting.md).
      ATLASSIAN_SITE_URL: ${{ vars.ATLASSIAN_SITE_URL }}
      # Optional name of the environment in PSMUSIC_UI_URL (e.g. qa): shown in Allure and Xray.
      PSMUSIC_ENVIRONMENT: ${{ vars.PSMUSIC_ENVIRONMENT }}
      # Xray Test Execution per run, linked to this run and its reports (docs/ci-cd.md section 9).
      # Without these secrets the step only warns. ATLASSIAN_CLOUD_ID (variable) is needed for scoped tokens.
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      ATLASSIAN_CLOUD_ID: ${{ vars.ATLASSIAN_CLOUD_ID }}
    steps:
      - uses: actions/checkout@v4

      # Install, type-check, run every test, keep the evidence.
      # Fails with "Missing environment variable ..." if the configuration is not set.
      - uses: ./.github/actions/run-suite
        with:
          title: Regression tests
          typecheck: 'true'
          artifact-suffix: regression
          xray-import: 'true'
          xray-test-plan: PLAN-REGRESSION
