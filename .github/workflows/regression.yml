# Full regression: every test in tests/. Started by hand from the Actions tab.
# Details: docs/ci-cd.md
name: Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PSMUSIC_UI_URL: ${{ vars.PSMUSIC_UI_URL }}
      PSMUSIC_API_URL: ${{ vars.PSMUSIC_API_URL }}
      PSMUSIC_SERVICE_KEY: ${{ secrets.PSMUSIC_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Fails with "Missing environment variable ..." if the configuration is not set.
      - name: Run regression tests
        run: npm run test:regression

      - name: Write results to the run summary
        if: ${{ !cancelled() }}
        run: node scripts/write-ci-summary.mjs "Regression tests"

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure report and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-regression
          path: |
            allure-report/
            allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
