# Fast feedback: type-check the code, then run the @smoke suite.
# Details: docs/ci-cd.md
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (install + type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The test job below is skipped until a PSMusic environment is configured.
      # This warning makes the skip visible on the run summary instead of silent.
      - name: Warn when no test environment is configured
        if: vars.PSMUSIC_UI_URL == '' || vars.PSMUSIC_API_URL == ''
        run: echo "::warning title=Smoke tests skipped::Repository variables PSMUSIC_UI_URL and PSMUSIC_API_URL are not set, so no tests ran. See docs/ci-cd.md#configuration."

  smoke-tests:
    name: Smoke tests
    needs: build
    if: vars.PSMUSIC_UI_URL != '' && vars.PSMUSIC_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PSMUSIC_UI_URL: ${{ vars.PSMUSIC_UI_URL }}
      PSMUSIC_API_URL: ${{ vars.PSMUSIC_API_URL }}
      PSMUSIC_SERVICE_KEY: ${{ secrets.PSMUSIC_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Install, run @smoke, keep the evidence.
      - uses: ./.github/actions/run-suite
        with:
          title: Smoke tests
          grep: '@smoke'
          artifact-suffix: smoke
